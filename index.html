<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine?</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffe6e6; /* Soft pink background */
            font-family: 'Arial', sans-serif;
            overflow: hidden; /* Prevents scrollbars when button moves */
        }

        .container {
            text-align: center;
            z-index: 10; /* Keeps content above background hearts */
            position: relative;
        }

        h1 {
            color: #d32f2f;
            font-size: 3rem;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .btn-group {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
        }

        button {
            padding: 15px 40px;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s;
            font-weight: bold;
        }

        #yesBtn {
            background-color: #ff4081;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 64, 129, 0.4);
        }

        #yesBtn:hover {
            transform: scale(1.1);
            background-color: #f50057;
        }

        #noBtn {
            background-color: white;
            color: #d32f2f;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            position: relative; /* Needed for movement logic */
        }

        /* Responsive Text Sizing */
        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            button { padding: 12px 30px; font-size: 1rem; }
        }

        /* Floating Hearts Background */
        .heart {
            position: absolute;
            bottom: -20px;
            background-color: rgba(255, 64, 129, 0.5);
            width: 20px;
            height: 20px;
            transform: rotate(45deg);
            animation: floatUp 10s linear infinite;
            z-index: 1;
        }
        
        .heart::before, .heart::after {
            content: "";
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: rgba(255, 64, 129, 0.5);
            border-radius: 50%;
        }

        .heart::before { top: -10px; left: 0; }
        .heart::after { left: -10px; top: 0; }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(45deg); opacity: 1; }
            100% { transform: translateY(-110vh) rotate(45deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="hearts-container"></div>

    <div class="container">
        <h1 id="question">Will you be my Valentine? 💖</h1>
        <div class="btn-group">
            <button id="yesBtn">Yes!</button>
            <button id="noBtn">No</button>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const question = document.getElementById('question');

        // Logic to make the 'No' button run away
        function moveButton() {
            // Get screen dimensions
            const maxWidth = window.innerWidth - noBtn.offsetWidth;
            const maxHeight = window.innerHeight - noBtn.offsetHeight;

            // Generate random position
            const randomX = Math.random() * maxWidth;
            const randomY = Math.random() * maxHeight;

            // Apply new position using absolute positioning
            noBtn.style.position = 'fixed'; // Changes from relative to fixed to allow free movement
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        // Trigger move on mouse hover (Desktop)
        noBtn.addEventListener('mouseover', moveButton);
        
        // Trigger move on touch (Mobile) - prevents clicking
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault(); // Prevents the 'click' from registering
            moveButton();
        });

        // 'Yes' Button Logic
        yesBtn.addEventListener('click', () => {
            question.innerText = "Yay! I love you! ❤️";
            noBtn.style.display = 'none'; // Hide the No button
            yesBtn.innerText = "See you soon!";
            
            // Optional: Confetti effect or more hearts could go here
            document.body.style.backgroundColor = "#ffc1e3";
        });

        // Create Floating Hearts Loop
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            
            // Randomize position and animation duration
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.animationDuration = Math.random() * 3 + 4 + "s"; // 4-7 seconds
            
            document.getElementById('hearts-container').appendChild(heart);

            // Remove heart after animation ends to keep DOM light
            setTimeout(() => {
                heart.remove();
            }, 7000);
        }

        setInterval(createHeart, 300); // Create a new heart every 300ms
    </script>
</body>
</html>
